<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPY Seasonality Grid</title>
<link rel="stylesheet" href="style.css" />
<style>
  :root{--bg:#0f0f11;--panel:#151518;--ink:#eaeaf0;--muted:#b8b8c2;--line:#2b2b33;}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial}
  h1{font-size:32px;margin:22px 0 8px;text-align:center}
  .sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:14px}
  .controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:0 auto 12px;max-width:1200px}
  .controls label{font-size:13px;color:var(--muted)}
  .controls select,.controls input,.controls button{
    padding:7px 9px;border:1px solid var(--line);background:#1b1b21;color:var(--ink);border-radius:6px
  }
  .controls button{cursor:pointer;background:#2864ff;border-color:#1f53e8}
  .note{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 16px}
  .table-wrap{overflow:auto;margin:0 auto 20px;max-width:1400px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  table{border-collapse:collapse;width:100%;min-width:960px}
  th,td{border:1px solid var(--line);padding:9px 10px;text-align:right}
  th{background:#1a1a21;position:sticky;top:0;z-index:1}
  th.sticky-left,td.sticky-left{position:sticky;left:0;background:#1a1a21;z-index:2;text-align:left}
  td.sticky-left{background:#17171c}
  .badge{display:inline-block;font-size:11px;line-height:1;padding:3px 6px;border:1px solid var(--line);border-radius:999px;margin-left:6px;color:#111;background:#eaeaf0}
  /* make numbers readable on dark/bright cells */
  td{font-weight:600}
</style>
</head>
<body>
  <h1>SPY Seasonality Grid</h1>
  <div class="sub">Heatmap table with red/green coloring. Data loads from CSVs in this repo.</div>

  <div class="controls">
    <label>Dataset
      <select id="dataset">
        <option value="spy" selected>SPY (prebuilt CSVs)</option>
        <option value="vix">VIX (daily CSV)</option>
        <option value="epu">EPU / FRED (daily CSV)</option>
      </select>
    </label>

    <label>Mode
      <select id="mode">
        <option value="monthly" selected>Monthly %</option>
        <option value="weekly">Weekly %</option>
      </select>
    </label>

    <label>Scale
      <select id="scale">
        <option value="fixed" selected>Fixed ±5%</option>
        <option value="auto">Auto (min–max)</option>
      </select>
    </label>

    <label>From <input type="number" id="fromYear" min="1990" max="2100" placeholder="2010"></label>
    <label>To <input type="number" id="toYear"   min="1990" max="2100" placeholder="2025"></label>

    <!-- restored selectors -->
    <label><input type="checkbox" id="showVix"> VIX badge</label>
    <label><input type="checkbox" id="showFomc"> FOMC badge</label>

    <button id="apply">Update View</button>
  </div>

  <div class="note">
    SPY reads <code>seasonality_monthly.csv</code> / <code>seasonality_weekly.csv</code>. VIX reads <code>VIX_History.csv</code>. EPU reads <code>USEPUINDXD.csv</code>.
  </div>

  <div class="table-wrap" id="grid"></div>

  <script src="js/grid.js"></script>
</body>
</html>
