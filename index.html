<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPY Seasonality Grid</title>
<link rel="stylesheet" href="style.css" />
<style>
  :root { --bg:#111; --panel:#1a1a1a; --panel2:#141414; --border:#2b2b2b; --text:#eee; }
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial;margin:0}
  h1{font-size:28px;margin:24px 0 8px;text-align:center}
  .sub{font-size:14px;opacity:.9;text-align:center;margin-bottom:18px}
  .controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .controls label{font-size:13px;opacity:.9}
  .controls input,.controls select,.controls button{padding:6px 8px;border:1px solid #444;background:#1c1c1c;color:#eee;border-radius:4px}
  .controls button{cursor:pointer}
  .note{font-size:12px;opacity:.75;text-align:center;margin:8px 0 16px}
  .table-wrap{overflow:auto;margin:0 auto;max-width:1400px;border:1px solid var(--border);border-radius:6px;min-height:240px}
  table{border-collapse:collapse;width:100%;min-width:960px}
  th, td{border:1px solid var(--border);padding:8px 10px;text-align:right}
  th{background:var(--panel);position:sticky;top:0;z-index:1}
  th.sticky-left, td.sticky-left{position:sticky;left:0;background:var(--panel);z-index:2;text-align:left}
  td.sticky-left{background:var(--panel2)}
  .badge{display:inline-block;font-size:11px;padding:2px 6px;border:1px solid #444;border-radius:10px;margin-left:6px}
  /* fallback text color if JS doesn’t set one */
  td{color:#eee}
</style>
</head>
<body>
  <h1>SPY Seasonality Grid</h1>
  <div class="sub">Heatmap table with red/green coloring. Data loads from CSVs in this repo.</div>

  <div class="controls">
    <label>Dataset
      <select id="dataset">
        <option value="spy" selected>SPY (prebuilt)</option>
        <option value="vix">VIX (daily CSV)</option>
        <option value="epu">EPU / FRED (daily CSV)</option>
      </select>
    </label>

    <label>Mode
      <select id="mode">
        <option value="monthly" selected>Monthly %</option>
        <option value="weekly">Weekly %</option>
      </select>
    </label>

    <label>From <input type="number" id="fromYear" min="1990" max="2100" placeholder="2010" /></label>
    <label>To <input type="number"   id="toYear"   min="1990" max="2100" placeholder="2025" /></label>

    <button id="apply">Update View</button>
  </div>

  <div class="note">
    SPY reads <code>seasonality_monthly.csv</code> / <code>seasonality_weekly.csv</code>.
    VIX reads <code>VIX_History.csv</code>. EPU reads <code>USEPUINDXD.csv</code>.
  </div>

  <div class="table-wrap" id="grid"></div>

  <script src="js/grid.js"></script>
</body>
</html>
