<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPY Seasonality Dashboard</title>
<link rel="stylesheet" href="style.css" />
<style>
  body{background:#111;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial}
  h1{font-size:28px;margin:24px 0 8px;text-align:center}
  .sub{font-size:14px;opacity:.9;text-align:center;margin-bottom:18px}

  .controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .controls label{font-size:13px;opacity:.9}
  .controls input,.controls select,.controls button{padding:6px 8px;border:1px solid #444;background:#1c1c1c;color:#eee;border-radius:4px}
  .controls button{cursor:pointer}

  .note{font-size:12px;opacity:.75;text-align:center;margin:8px 0 16px}

  .table-wrap{overflow:auto;margin:0 auto;max-width:1400px;border:1px solid #333;border-radius:6px}
  table{border-collapse:collapse;width:100%;min-width:960px}
  th, td{border:1px solid #2b2b2b;padding:8px 10px;text-align:right}
  th{background:#1a1a1a;position:sticky;top:0;z-index:1;color:#eee}
  th.sticky-left, td.sticky-left{position:sticky;left:0;background:#1a1a1a;z-index:2;text-align:left}
  td.sticky-left{background:#141414}

  /* readability inside heatmap cells */
  table td{color:#000}            /* numbers in cells are black */
  .badge{display:inline-block;font-size:11px;padding:2px 6px;border:1px solid #444;border-radius:10px;margin-left:6px;color:#000;background:#eee}
</style>
</head>
<body>
  <h1>SPY Seasonality Grid</h1>
  <div class="sub">Heatmap table with red/green coloring. Data loads from CSV in this repo.</div>

  <div class="controls">
    <label>Mode
      <select id="mode">
        <option value="monthly" selected>Monthly %</option>
        <option value="weekly">Weekly %</option>
        <option value="implied">Implied (VIX)</option> <!-- NEW -->
      </select>
    </label>

    <!-- NEW: only visible when Mode = Implied (VIX) -->
    <label id="impliedPeriodWrap" style="display:none;">
      Period
      <select id="impliedPeriod">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
    </label>

    <label>From <input type="number" id="fromYear" min="1990" max="2100" placeholder="2010" /></label>
    <label>To <input type="number" id="toYear" min="1990" max="2100" placeholder="2025" /></label>

    <label><input type="checkbox" id="showVix" /> VIX badge</label>
    <label><input type="checkbox" id="showFomc" /> FOMC badge</label>

    <button id="apply">Update View</button>
  </div>

  <div class="note">
    Files expected:
    <code>seasonality_monthly.csv</code> (Year,1–12) and
    <code>seasonality_weekly.csv</code> (Year,10–27) for returns modes;
    and <code>VIX_History.csv</code> (Date,Close) for <b>Implied (VIX)</b>.
  </div>

  <div class="table-wrap" id="grid"></div>

  <script src="js/grid.js"></script>
  <script>
    // tiny helper to show/hide period select
    const modeSel = document.getElementById('mode');
    const wrap = document.getElementById('impliedPeriodWrap');
    function toggle() { wrap.style.display = modeSel.value === 'implied' ? '' : 'none'; }
    modeSel.addEventListener('change', toggle);
    toggle();
  </script>
</body>
</html>
