<div class="controls">
  <label>Dataset
    <select id="dataset">
      <option value="spy" selected>SPY (prebuilt)</option>
      <option value="vix">VIX (daily CSV)</option>
      <option value="epu">EPU / FRED (daily CSV)</option>
    </select>
  </label>

  <label>Mode
    <select id="mode">
      <option value="monthly" selected>Monthly %</option>
      <option value="weekly">Weekly %</option>
    </select>
  </label>

  <label>From <input type="number" id="fromYear" min="1990" max="2100" placeholder="2010" /></label>
  <label>To <input type="number" id="toYear"   min="1990" max="2100" placeholder="2025" /></label>

  <button id="apply">Update View</button>
</div>

<div class="note">
  SPY reads <code>seasonality_monthly.csv</code> / <code>seasonality_weekly.csv</code>.
  VIX reads <code>VIX_History.csv</code>.  
  EPU reads <code>USEPUINDXD.csv</code>.
</div>
