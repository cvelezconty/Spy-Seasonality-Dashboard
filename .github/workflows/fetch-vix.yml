name: Fetch VIX CSV daily

on:
  schedule:
    - cron: "15 11 * * 1-5"   # Weekdays ~11:15 UTC
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download latest VIX CSV from CBOE
        run: |
          set -e
          mkdir -p data
          # 👉 Replace this URL with the actual CSV link from the CBOE page:
          # "VIX Index data for 1990 to present (Updated Daily)"
          curl -L --fail \
            "https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv" \
            -o data/VIX_History.csv
          echo "VIX csv saved to data/VIX_History.csv"

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/VIX_History.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update VIX_History.csv"
            git push
          else
            echo "No changes to commit"
          fi
